[project]
name = "mcp-maya"
version = "0.1.0"
description = "MCP server that drives a running Autodesk Maya session through its commandPort"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
]

[project.scripts]
mcp-maya = "mcp_maya.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_maya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
